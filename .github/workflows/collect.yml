name: Delhi Bus Data Collection

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Job to execute"
        required: false
        default: "collect"
        type: choice
        options:
          - collect
          - compile
          - all
  schedule:
    - cron: "*/5 * * * *"
    - cron: "5 18 * * *"

jobs:
  collect:
    if: >-
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'collect' || inputs.target == 'all' || !inputs.target))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Delhi bus data
        env:
          DELHI_API_KEY: ${{ secrets.DELHI_API_KEY }}
          GOOGLE_DRIVE_TOKEN_B64: ${{ secrets.GOOGLE_DRIVE_TOKEN_B64 }}
        run: python Collector/Collect.py

  compile:
    if: >-
      github.event.schedule == '5 18 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'compile' || inputs.target == 'all'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile daily data
        env:
          GOOGLE_DRIVE_TOKEN_B64: ${{ secrets.GOOGLE_DRIVE_TOKEN_B64 }}
        run: python Compiler/Compile.py

