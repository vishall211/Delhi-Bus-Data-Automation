name: Delhi Bus Data Collection

on:
  repository_dispatch:
    types: [collect]

  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Delhi bus data
        env:
          DELHI_API_KEY: ${{ secrets.DELHI_API_KEY }}
          GOOGLE_DRIVE_TOKEN_B64: ${{ secrets.GOOGLE_DRIVE_TOKEN_B64 }}
        run: python Collector/Collect.py