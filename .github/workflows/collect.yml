name: Delhi Bus Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Delhi bus data
        env:
          DELHI_API_KEY: ${{ secrets.DELHI_API_KEY }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: python Collector/Collect.py
